<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería de Películas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <div class="header-content">
      <h1>Galería de Películas</h1>
      <p>Explorá películas por categoría — hacé clic para ver el detalle</p>
    </div>

    <div class="header-right">
      <div class="language" id="language">
        <button class="language-btn active" data-lang="es-ES">Español</button>
        <button class="language-btn" data-lang="en-US">English</button>
      </div>
      <div class="service-status" id="service-status"></div>
      <div class="favorites" id="favorites">❤ Favoritos: 0</div>
    </div>
  </header>

  <div class="search-wrap">
    <input type="text" id="search-input" class="search-input" placeholder="Buscar película por título..." autocomplete="off">
  </div>

  <div id="ads-banner" class="ads-slot"></div>

  <nav class="tabs" id="tabs"></nav>

  <div id="reviews-panel" class="reviews-panel"></div>
  <p id="cache-indicator" class="cache-indicator"></p>

  <div id="spinner" class="spinner">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <span id="spinner-text">Cargando películas...</span>
  </div>

  <main id="movies" class="grid"></main>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <button id="modal-close" class="modal-close">&times;</button>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script type="module" src="dist/app.js"></script>
</body>
</html>
